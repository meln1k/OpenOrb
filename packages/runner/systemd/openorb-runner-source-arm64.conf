[Service]
Environment=DENO_DIR=/var/cache/openorb-runner/deno
ExecStart=
ExecStart=/usr/local/bin/deno run --cached-only --frozen --config=/opt/openorb/deno.json --lock=/opt/openorb/deno.lock --allow-read=/opt/openorb,/var/cache/openorb-runner/deno,/var/lib/openorb-runner,/lib,/lib64,/usr/lib,/usr/lib64 --allow-write=/var/lib/openorb-runner --allow-net --allow-env=PATH,PWD,NODE_V8_COVERAGE,TF_BUILD --allow-sys=cpus,gid,homedir,hostname,networkInterfaces,osRelease,statfs,systemMemoryInfo,uid --allow-run=/usr/bin/qemu-system-aarch64,/usr/bin/qemu-img /opt/openorb/packages/runner/src/standalone.ts
