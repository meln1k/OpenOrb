services:
  gotel:
    command: GOTEL_OTEL_HOST=127.0.0.1 GOTEL_OTEL_PORT="$PORT" gotel server
    port: 27686
  workspace:
    command: deno task dev:workspace
    port: 44200
  gateway:
    command: deno task dev:gateway
    port: 44100
    portal:
      title: OpenOrb
      description: OpenOrb gateway with local OpenTelemetry export to GoTel.
