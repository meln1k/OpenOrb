name: Release acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openorb-release-acceptance
  cancel-in-progress: false

jobs:
  acceptance:
    name: Secret-gated browser, Pi, Gondolin, and GitHub acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      OPENORB_GITHUB_TEST_REPOSITORY: ${{ secrets.OPENORB_GITHUB_TEST_REPOSITORY }}
      OPENORB_GITHUB_TEST_TOKEN: ${{ secrets.OPENORB_GITHUB_TEST_TOKEN }}
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.11.1
          cache: npm
      - run: npm ci
      - name: Require release acceptance secrets
        shell: bash
        run: |
          missing=()
          for name in OPENORB_GITHUB_TEST_REPOSITORY OPENORB_GITHUB_TEST_TOKEN OPENCODE_API_KEY; do
            if [[ -z "${!name}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} )); then
            printf '::error::Missing required release acceptance secrets: %s\n' "${missing[*]}"
            exit 1
          fi
      - name: Install pinned Worker runtime and bundler
        run: bash scripts/install-celld.sh
      - name: Install virtualization, image, and browser dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes e2fsprogs podman qemu-system-x86 qemu-utils
          test -c /dev/kvm
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm -a -w /dev/kvm
          npx --no-install playwright install --with-deps chromium
      - name: Build pinned x64 guest image
        run: npm run build:image -- x86_64
      - name: Run credential-enabled Gondolin security suite
        env:
          OPENORB_RUN_GITHUB_WRITE_TESTS: "1"
        run: npm run test:gondolin
      - name: Run full browser-to-Pi release lifecycle
        run: npm run release:acceptance
